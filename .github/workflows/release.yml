# Marks a source checkpoint of clypse: the tag v<version> on a commit of main that the CI workflow has passed, and its
# GitHub release, whose notes say which blazwiz version it is built on and list the changes since the last release.
# Nothing is built or published: GitHub attaches the source archives itself, and deployments are made from source by
# the Deploy and Upgrade workflows. A release names a commit that was deployed and can be deployed again.
#
# Run by hand (Actions > Release > Run workflow) on main, giving the version.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to tag, MAJOR.MINOR.PATCH, e.g. 1.2.0. The tag is v<version>.'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  ci-passed:
    uses: ./.github/workflows/ci-passed.yml

  release:
    needs: ci-passed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Through the environment, never into the script: an input can hold quotes and $( ).
      VERSION: ${{ inputs.version }}
      REF_NAME: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        shell: pwsh
        run: |
          if ($env:REF_NAME -ne 'main') { throw "Releases are made from main, not '$env:REF_NAME'." }
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "The version must be MAJOR.MINOR.PATCH, e.g. 1.2.0, not '$env:VERSION'." }

          gh release view "v$env:VERSION" --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) { throw "v$env:VERSION is already released." }
          $global:LASTEXITCODE = 0

          $latest = gh release list --repo '${{ github.repository }}' --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($latest -and [version]$latest.TrimStart('v') -ge [version]$env:VERSION) {
            throw "The version must be above the latest release, $latest."
          }

      # A checkpoint is always on a released blazwiz: a local build could not be restored to deploy it again.
      - name: Check BlazwizVersion is a released version
        shell: pwsh
        run: ./eng/check-blazwiz-version.ps1

      - name: Create the tag and release
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Packages.props)
          $blazwiz = $props.Project.PropertyGroup.BlazwizVersion | Where-Object { $_ } | Select-Object -First 1
          if (-not $blazwiz) { throw 'Directory.Packages.props has no BlazwizVersion.' }

          # A beta of blazwiz has no GitHub release to link to.
          $framework = if ($blazwiz -match '-') { "blazwiz $blazwiz" } else { "[blazwiz $blazwiz](https://github.com/devoctomy/blazwiz/releases/tag/v$blazwiz)" }
          @(
            "Built on $framework.",
            '',
            "Source checkpoint, deployed from source: run the Deploy or Upgrade workflow at tag ``v$env:VERSION``."
          ) | Set-Content -Path release-notes.md -Encoding utf8

          # The changes since the previous release are generated by GitHub and follow the notes above.
          gh release create "v$env:VERSION" --repo '${{ github.repository }}' --target '${{ github.sha }}' --title $env:VERSION --notes-file release-notes.md --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Released v$env:VERSION at ${{ github.sha }}, built on blazwiz $blazwiz."
