# Marks a source checkpoint of clypse: the tag v<version> on a commit of main that the CI workflow has passed, and its
# GitHub release, whose notes say which blazwiz version it is built on, followed by the version's CHANGELOG.md section.
# Nothing is built or published: GitHub attaches the source archives itself, and deployments are made from source by
# the Deploy and Upgrade workflows. A release names a commit that was deployed and can be deployed again.
#
# Run by hand (Actions > Release > Run workflow) on main. The version is VersionPrefix in Directory.Build.props, set
# with eng/bump-version.ps1 and merged before releasing.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ci-passed:
    uses: ./.github/workflows/ci-passed.yml

  release:
    needs: ci-passed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Through the environment, never into the script: a branch name can hold quotes and $( ).
      REF_NAME: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        shell: pwsh
        run: |
          if ($env:REF_NAME -ne 'main') { throw "Releases are made from main, not '$env:REF_NAME'." }

          $props = [xml](Get-Content Directory.Build.props)
          $version = $props.Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VersionPrefix in Directory.Build.props must be MAJOR.MINOR.PATCH, e.g. 1.2.0, not '$version'." }

          gh release view "v$version" --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) { throw "v$version is already released. Set the next version with ./eng/bump-version.ps1, merge it, then release." }
          $global:LASTEXITCODE = 0

          $latest = gh release list --repo '${{ github.repository }}' --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($latest -and [version]$latest.TrimStart('v') -ge [version]$version) {
            throw "The version ($version) must be above the latest release, $latest. Set it with ./eng/bump-version.ps1."
          }

          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## $([regex]::Escape($version))\s*$" -Quiet)) {
            throw "CHANGELOG.md has no section for $version. Set the version with ./eng/bump-version.ps1, merge it, then release."
          }

          "VERSION=$version" >> $env:GITHUB_ENV

      # A checkpoint is always on a released blazwiz: a local build could not be restored to deploy it again.
      - name: Check BlazwizVersion is a released version
        shell: pwsh
        run: ./eng/check-blazwiz-version.ps1

      - name: Create the tag and release
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Packages.props)
          $blazwiz = $props.Project.PropertyGroup.BlazwizVersion | Where-Object { $_ } | Select-Object -First 1
          if (-not $blazwiz) { throw 'Directory.Packages.props has no BlazwizVersion.' }

          # A beta of blazwiz has no GitHub release to link to.
          $framework = if ($blazwiz -match '-') { "blazwiz $blazwiz" } else { "[blazwiz $blazwiz](https://github.com/devoctomy/blazwiz/releases/tag/v$blazwiz)" }
          # The version's changelog section follows, as in blazwiz's releases.
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($env:VERSION))[^\r\n]*\r?\n(.*?)(?=^## |\z)").Groups[1].Value.Trim()
          @(
            "Built on $framework.",
            '',
            "Source checkpoint, deployed from source: run the Deploy or Upgrade workflow at tag ``v$env:VERSION``.",
            '',
            $section
          ) | Set-Content -Path release-notes.md -Encoding utf8

          gh release create "v$env:VERSION" --repo '${{ github.repository }}' --target '${{ github.sha }}' --title $env:VERSION --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Released v$env:VERSION at ${{ github.sha }}, built on blazwiz $blazwiz."
