# Destroys a clypse environment on AWS: clypse's own stack, then the base stack, its buckets and every object in them,
# and all its Cognito users. Run by hand (Actions > Destroy > Run workflow). This cannot be undone.
#
# The environment's name must be typed again to confirm. Uses the same GitHub environment settings as the Deploy
# workflow (AWS_DEPLOY_ROLE_ARN, AWS_REGION). It does not need CI to have passed: it deploys nothing.
name: Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment name, e.g. test (the stacks clypse-<environment>).'
        required: true
      confirm:
        description: 'Type the environment name again to confirm. Everything in it is deleted for good.'
        required: true

permissions:
  contents: read

concurrency:
  group: aws-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      # An OIDC token from GitHub, exchanged for short-lived AWS credentials.
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ENVIRONMENT_NAME: ${{ inputs.environment }}
      CONFIRMATION: ${{ inputs.confirm }}
    steps:
      - name: Check the confirmation
        shell: pwsh
        run: |
          if ($env:ENVIRONMENT_NAME -notmatch '^[a-z0-9]+$') { throw "The environment name must be lowercase letters and numbers: '$env:ENVIRONMENT_NAME'." }
          if ($env:CONFIRMATION -cne $env:ENVIRONMENT_NAME) { throw "The confirmation '$env:CONFIRMATION' is not the environment name '$env:ENVIRONMENT_NAME'. Nothing was deleted." }
          if (-not '${{ vars.AWS_DEPLOY_ROLE_ARN }}') { throw "The GitHub environment '$env:ENVIRONMENT_NAME' has no AWS_DEPLOY_ROLE_ARN variable." }
          if (-not '${{ vars.AWS_REGION }}') { throw "The GitHub environment '$env:ENVIRONMENT_NAME' has no AWS_REGION variable." }

      - uses: actions/checkout@v4

      # The base stack's remove script comes with the Devoctomy.Blazwiz.Aws package, restored at BlazwizVersion.
      - name: Check BlazwizVersion is a released version
        shell: pwsh
        run: ./eng/check-blazwiz-version.ps1

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Destroy
        shell: pwsh
        run: ./cloudformation/remove.ps1 -Region '${{ vars.AWS_REGION }}' -Environment $env:ENVIRONMENT_NAME -Force
