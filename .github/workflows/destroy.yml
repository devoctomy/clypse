# Destroys a clypse environment on AWS: clypse's own stack, then the base stack, its buckets and every object in them,
# and all its Cognito users. Run by hand (Actions > Destroy > Run workflow). This cannot be undone.
#
# Only the environments listed in the repository variable DESTROY_ALLOWED_ENVIRONMENTS (Settings > Secrets and
# variables > Actions > Variables; names separated by commas or spaces, e.g. "test") can be destroyed. Any other is
# refused before its GitHub environment is asked for, so before any approval and before AWS is reached. With the
# variable missing or empty, nothing can be destroyed.
#
# The environment's name must be typed again to confirm. Uses the same GitHub environment settings as the Deploy
# workflow (AWS_DEPLOY_ROLE_ARN, AWS_REGION). It does not need CI to have passed: it deploys nothing.
name: Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment name, e.g. test (the stacks clypse-<environment>).'
        required: true
      confirm:
        description: 'Type the environment name again to confirm. Everything in it is deleted for good.'
        required: true

permissions:
  contents: read

concurrency:
  group: aws-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Runs without the GitHub environment, so an environment that may not be destroyed is refused before anything is
  # asked of it: no approval is requested, and no AWS credentials are issued.
  allowed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ENVIRONMENT_NAME: ${{ inputs.environment }}
      CONFIRMATION: ${{ inputs.confirm }}
      # The repository's variable, not an environment's: this job has no environment.
      DESTROY_ALLOWED_ENVIRONMENTS: ${{ vars.DESTROY_ALLOWED_ENVIRONMENTS }}
    steps:
      - name: Check the environment may be destroyed
        shell: pwsh
        run: |
          if ($env:ENVIRONMENT_NAME -notmatch '^[a-z0-9]+$') { throw "The environment name must be lowercase letters and numbers: '$env:ENVIRONMENT_NAME'." }
          if ($env:CONFIRMATION -cne $env:ENVIRONMENT_NAME) { throw "The confirmation '$env:CONFIRMATION' is not the environment name '$env:ENVIRONMENT_NAME'. Nothing was deleted." }
          $allowed = @("$env:DESTROY_ALLOWED_ENVIRONMENTS" -split '[,\s]+' | Where-Object { $_ })
          if ($allowed -cnotcontains $env:ENVIRONMENT_NAME) { throw "This workflow may not destroy the environment '$env:ENVIRONMENT_NAME': it is not listed in the repository variable DESTROY_ALLOWED_ENVIRONMENTS. Nothing was deleted." }

  destroy:
    needs: allowed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      # An OIDC token from GitHub, exchanged for short-lived AWS credentials.
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ENVIRONMENT_NAME: ${{ inputs.environment }}
    steps:
      - name: Check the environment's settings
        shell: pwsh
        run: |
          if (-not '${{ vars.AWS_DEPLOY_ROLE_ARN }}') { throw "The GitHub environment '$env:ENVIRONMENT_NAME' has no AWS_DEPLOY_ROLE_ARN variable." }
          if (-not '${{ vars.AWS_REGION }}') { throw "The GitHub environment '$env:ENVIRONMENT_NAME' has no AWS_REGION variable." }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The base stack's remove script comes with the Devoctomy.Blazwiz.Aws package, restored at BlazwizVersion.
      - name: Check BlazwizVersion is a released version
        shell: pwsh
        run: ./eng/check-blazwiz-version.ps1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # What GitHub's OIDC token says, so a refused sign-in can be matched against the role's trust policy. Prints
      # the token's claims only, never the token, which is short-lived and only accepted with this audience.
      - name: Show the OIDC token's claims
        shell: pwsh
        run: |
          $response = Invoke-RestMethod -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" -Headers @{ Authorization = "bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
          $payload = $response.value.Split('.')[1].Replace('-', '+').Replace('_', '/')
          $payload += '=' * ((4 - $payload.Length % 4) % 4)
          $claims = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload)) | ConvertFrom-Json
          Write-Host "sub:         $($claims.sub)"
          Write-Host "aud:         $($claims.aud)"
          Write-Host "iss:         $($claims.iss)"
          Write-Host "repository:  $($claims.repository)"
          Write-Host "environment: $($claims.environment)"
          Write-Host "ref:         $($claims.ref)"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Destroy
        shell: pwsh
        run: ./cloudformation/remove.ps1 -Region '${{ vars.AWS_REGION }}' -Environment $env:ENVIRONMENT_NAME -Force
