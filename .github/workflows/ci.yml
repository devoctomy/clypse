# Builds and tests clypse on every push, to any branch. The deploy and upgrade workflows only deploy a commit this has
# passed. The unit tests' coverage is sent to Codacy.
#
# Pushes only, not pull requests as well: the push run's checks already show on a pull request from this repository
# (they are on the same commit).
#
# Not for a push that only creates a branch, with no commits of its own: that commit was already tested on the branch it
# was made from.
#
# Linux, with the Ubuntu version fixed rather than ubuntu-latest: the Playwright version in use must support it, and a
# new runner image should not change what the tests run on unannounced.
name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Fresh MSBuild processes for every build (static web assets compression; see AGENTS.md).
  MSBUILDDISABLENODEREUSE: 1

jobs:
  test:
    if: ${{ !github.event.created || github.event.commits[0] != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # clypse is built against released blazwiz packages here. A build packed locally from the blazwiz source
      # (eng/use-local-blazwiz.ps1, version <prefix>-local.<timestamp>) is only on the machine that packed it.
      - name: Check BlazwizVersion is a released version
        shell: pwsh
        run: ./eng/check-blazwiz-version.ps1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The UI tests build the portal in Release, which relinks the WebAssembly runtime (Clypse.Portal.csproj).
      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore Clypse.slnx

      - name: Build
        run: dotnet build Clypse.slnx --no-restore

      # Coverlet (coverlet.collector) writes a Cobertura report, coverage.cobertura.xml, for each test project.
      - name: Unit tests
        run: dotnet test Clypse.slnx --no-build --filter "FullyQualifiedName~UnitTests" --logger trx --results-directory TestResults/unit --collect:"XPlat Code Coverage"

      # Codacy's coverage reporter, at a fixed version: get.sh is fetched from that release's commit, and checks the
      # reporter it downloads against its checksum. The CODACY_API_TOKEN repository secret is a Codacy account API token,
      # so it goes with the repository it is for (provider, organization, name). Each report is sent once: the trx
      # logger also copies every report into its run's In folder, and those copies are left out.
      - name: Upload coverage to Codacy
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_ORGANIZATION_PROVIDER: gh
          CODACY_USERNAME: devoctomy
          CODACY_PROJECT_NAME: clypse
          CODACY_REPORTER_VERSION: 14.1.3
        run: |
          reports=()
          while IFS= read -r report; do reports+=(-r "$report"); done < <(find TestResults/unit -name coverage.cobertura.xml -not -path '*/In/*')
          bash <(curl -Ls https://raw.githubusercontent.com/codacy/codacy-coverage-reporter/54617baa57421746d0afa3df32127d3dd40f3786/get.sh) report "${reports[@]}"

      # --with-deps also installs the libraries Chromium needs on Linux.
      - name: Install the Playwright browser
        shell: pwsh
        run: ./Clypse.Portal.UITests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # The UI tests build and start the portal themselves (Release); its output is in TestResults/portal.log.
      - name: UI tests
        run: dotnet test Clypse.slnx --no-build --filter "FullyQualifiedName~UITests" --logger trx --results-directory TestResults/ui

      # The UI tests build and run the portal themselves, so a failure there is only explained in portal.log. Printed
      # here so it shows in the run's log, and uploaded on its own.
      - name: Show the portal log
        if: ${{ !success() }}
        shell: pwsh
        run: |
          $logs = Get-ChildItem -Path . -Recurse -Filter portal.log -File -ErrorAction SilentlyContinue
          if (-not $logs) { Write-Host "No portal.log found."; exit 0 }
          foreach ($log in $logs) {
            Write-Host "::group::$($log.FullName)"
            Get-Content $log.FullName
            Write-Host "::endgroup::"
          }

      - name: Upload the portal log
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-log
          path: '**/portal.log'
          if-no-files-found: warn

      - name: Upload test results
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            TestResults/**
            **/bin/Debug/net10.0/TestResults/**
          if-no-files-found: ignore
