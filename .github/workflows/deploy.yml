# Deploys a NEW clypse environment to AWS: the blazwiz base stack and clypse's own stack (app.yaml), the portal, and
# optionally a test user. Run by hand (Actions > Deploy > Run workflow), on a commit the CI workflow has passed.
#
# Refused if the environment already exists: use the Upgrade workflow to update one.
#
# Each environment is a GitHub environment of the same name (Settings > Environments), holding:
# - variable AWS_DEPLOY_ROLE_ARN: the IAM role GitHub assumes through OIDC (no AWS keys are kept in GitHub). It needs
#   the minimum deploy policy in cloudformation/README.md.
# - variable AWS_REGION: the region the environment is in, e.g. eu-west-2.
# - secret TEST_USER_PASSWORD: only if a test user is created (min 12 characters, upper, lower and a number).
# Add required reviewers to the GitHub environment to approve each run before it starts.
#
# It uses the blazwiz version set in Directory.Packages.props (BlazwizVersion), restored from nuget.org.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment name (lowercase letters and numbers), e.g. test. The stacks are clypse-<environment>.'
        required: true
        default: test
      test_user_email:
        description: 'Email of a test user to create (optional; its password is the environment secret TEST_USER_PASSWORD).'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: aws-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  ci-passed:
    uses: ./.github/workflows/ci-passed.yml

  deploy:
    needs: ci-passed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      # An OIDC token from GitHub, exchanged for short-lived AWS credentials.
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      MSBUILDDISABLENODEREUSE: 1
      ENVIRONMENT_NAME: ${{ inputs.environment }}
      TEST_USER_EMAIL: ${{ inputs.test_user_email }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the inputs
        shell: pwsh
        run: |
          if ($env:ENVIRONMENT_NAME -notmatch '^[a-z0-9]+$') { throw "The environment name must be lowercase letters and numbers: '$env:ENVIRONMENT_NAME'." }
          if (-not '${{ vars.AWS_DEPLOY_ROLE_ARN }}') { throw "The GitHub environment '$env:ENVIRONMENT_NAME' has no AWS_DEPLOY_ROLE_ARN variable." }
          if (-not '${{ vars.AWS_REGION }}') { throw "The GitHub environment '$env:ENVIRONMENT_NAME' has no AWS_REGION variable." }
          if ($env:TEST_USER_EMAIL -and -not $env:TEST_USER_PASSWORD) { throw "A test user was asked for, but the GitHub environment '$env:ENVIRONMENT_NAME' has no TEST_USER_PASSWORD secret." }

      - name: Check BlazwizVersion is a released version
        shell: pwsh
        run: ./eng/check-blazwiz-version.ps1

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The portal is compiled ahead of time to WebAssembly when published (Clypse.Portal.csproj).
      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check the environment does not exist yet
        shell: pwsh
        run: |
          $stack = "clypse-$env:ENVIRONMENT_NAME"
          aws cloudformation describe-stacks --stack-name $stack --region '${{ vars.AWS_REGION }}' *> $null
          if ($LASTEXITCODE -eq 0) { throw "Stack $stack already exists. Use the Upgrade workflow to update it." }
          Write-Host "Stack $stack does not exist yet."

      # Parameters written out, not splatted from a hashtable: the app's deploy.ps1 passes them on to the base stack's
      # with @args, which turns a hashtable's switches (Force = $true) into a stray "True".
      - name: Deploy
        shell: pwsh
        run: |
          $region = '${{ vars.AWS_REGION }}'
          if ($env:TEST_USER_EMAIL) {
            $password = ConvertTo-SecureString $env:TEST_USER_PASSWORD -AsPlainText -Force
            ./cloudformation/deploy.ps1 -Region $region -Environment $env:ENVIRONMENT_NAME -TestUserEmail $env:TEST_USER_EMAIL -TestUserPassword $password -Force
          }
          else {
            ./cloudformation/deploy.ps1 -Region $region -Environment $env:ENVIRONMENT_NAME -SkipTestUser -Force
          }
