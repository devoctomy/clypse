# Deploys a NEW clypse environment to AWS: the blazwiz base stack and clypse's own stack (app.yaml), the portal, and
# optionally the deploy tests' user, then optionally runs the deploy tests (deploy-tests.yml). Run by hand (Actions > Deploy > Run workflow), on a commit the CI workflow has passed.
#
# Refused if the environment already exists: use the Upgrade workflow to update one.
#
# Each environment is a GitHub environment of the same name (Settings > Environments), holding:
# - variable AWS_DEPLOY_ROLE_ARN: the IAM role GitHub assumes through OIDC (no AWS keys are kept in GitHub). It needs
#   the minimum deploy policy in cloudformation/README.md.
# - variable AWS_REGION: the region the environment is in, e.g. eu-west-2.
# - variable TEST_USER_EMAIL and secret TEST_USER_PASSWORD: the deploy tests' user, an account kept only for those
#   tests. Needed only if it is created or the tests run (the password: min 12 characters, upper, lower and a number).
# - variables CUSTOM_DOMAIN_NAME and CERTIFICATE_ARN: optional, both or neither. The portal's own address (e.g.
#   test.clypse.net) and an ACM certificate for it in us-east-1. Point the address's DNS at the CloudFront distribution.
# Add required reviewers to the GitHub environment to approve each run before it starts.
#
# It uses the blazwiz version set in Directory.Packages.props (BlazwizVersion), restored from nuget.org.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment name (lowercase letters and numbers), e.g. test. The stacks are clypse-<environment>.'
        required: true
        default: test
      create_test_user:
        description: "Create or update the deploy tests' user (TEST_USER_EMAIL, with the password TEST_USER_PASSWORD)."
        type: boolean
        required: false
        default: false
      run_deploy_tests:
        description: 'Run the deploy tests afterwards.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: aws-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  ci-passed:
    uses: ./.github/workflows/ci-passed.yml

  deploy:
    needs: ci-passed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      # An OIDC token from GitHub, exchanged for short-lived AWS credentials.
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      MSBUILDDISABLENODEREUSE: 1
      ENVIRONMENT_NAME: ${{ inputs.environment }}
      # Optional: the portal's own address, e.g. test.clypse.net, and its ACM certificate (in us-east-1). Passed on every
      # run, as the stack drops the address when they are not.
      CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
      CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
      CREATE_TEST_USER: ${{ inputs.create_test_user }}
      TEST_USER_EMAIL: ${{ vars.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the inputs
        shell: pwsh
        run: |
          if ($env:ENVIRONMENT_NAME -notmatch '^[a-z0-9]+$') { throw "The environment name must be lowercase letters and numbers: '$env:ENVIRONMENT_NAME'." }
          if (-not '${{ vars.AWS_DEPLOY_ROLE_ARN }}') { throw "The GitHub environment '$env:ENVIRONMENT_NAME' has no AWS_DEPLOY_ROLE_ARN variable." }
          if (-not '${{ vars.AWS_REGION }}') { throw "The GitHub environment '$env:ENVIRONMENT_NAME' has no AWS_REGION variable." }
          if ([bool]$env:CUSTOM_DOMAIN_NAME -ne [bool]$env:CERTIFICATE_ARN) { throw "The GitHub environment '$env:ENVIRONMENT_NAME' must have both CUSTOM_DOMAIN_NAME and CERTIFICATE_ARN, or neither." }
          if ($env:CREATE_TEST_USER -eq 'true' -and -not ($env:TEST_USER_EMAIL -and $env:TEST_USER_PASSWORD)) { throw "The deploy tests' user was asked for, but the GitHub environment '$env:ENVIRONMENT_NAME' lacks the TEST_USER_EMAIL variable or the TEST_USER_PASSWORD secret." }

      - name: Check BlazwizVersion is a released version
        shell: pwsh
        run: ./eng/check-blazwiz-version.ps1

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The portal is compiled ahead of time to WebAssembly when published (Clypse.Portal.csproj).
      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      # What GitHub's OIDC token says, so a refused sign-in can be matched against the role's trust policy. Prints
      # the token's claims only, never the token, which is short-lived and only accepted with this audience.
      - name: Show the OIDC token's claims
        shell: pwsh
        run: |
          $response = Invoke-RestMethod -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" -Headers @{ Authorization = "bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
          $payload = $response.value.Split('.')[1].Replace('-', '+').Replace('_', '/')
          $payload += '=' * ((4 - $payload.Length % 4) % 4)
          $claims = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload)) | ConvertFrom-Json
          Write-Host "sub:         $($claims.sub)"
          Write-Host "aud:         $($claims.aud)"
          Write-Host "iss:         $($claims.iss)"
          Write-Host "repository:  $($claims.repository)"
          Write-Host "environment: $($claims.environment)"
          Write-Host "ref:         $($claims.ref)"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check the environment does not exist yet
        shell: pwsh
        run: |
          $stack = "clypse-$env:ENVIRONMENT_NAME"
          aws cloudformation describe-stacks --stack-name $stack --region '${{ vars.AWS_REGION }}' *> $null
          if ($LASTEXITCODE -eq 0) { throw "Stack $stack already exists. Use the Upgrade workflow to update it." }
          Write-Host "Stack $stack does not exist yet."

      # Parameters written out, not splatted from a hashtable: the app's deploy.ps1 passes them on to the base stack's
      # with @args, which turns a hashtable's switches (Force = $true) into a stray "True".
      - name: Deploy
        shell: pwsh
        run: |
          $region = '${{ vars.AWS_REGION }}'
          if ($env:CREATE_TEST_USER -eq 'true') {
            $password = ConvertTo-SecureString $env:TEST_USER_PASSWORD -AsPlainText -Force
            ./cloudformation/deploy.ps1 -Region $region -Environment $env:ENVIRONMENT_NAME -CustomDomainName $env:CUSTOM_DOMAIN_NAME -CertificateArn $env:CERTIFICATE_ARN -TestUserEmail $env:TEST_USER_EMAIL -TestUserPassword $password -Force
          }
          else {
            ./cloudformation/deploy.ps1 -Region $region -Environment $env:ENVIRONMENT_NAME -CustomDomainName $env:CUSTOM_DOMAIN_NAME -CertificateArn $env:CERTIFICATE_ARN -SkipTestUser -Force
          }

  deploy-tests:
    needs: deploy
    if: ${{ inputs.run_deploy_tests }}
    uses: ./.github/workflows/deploy-tests.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
