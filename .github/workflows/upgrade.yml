name: Upgrade

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed

permissions:
  contents: read

jobs:
  upgrade:
    if: github.repository == 'devoctomy/clypse' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    container:
      image: squeezybeef/clypse-ci:latest
    environment: production

    steps:
    - name: Checkout source at tested commit
      uses: actions/checkout@v6
      with:
        repository: ${{ github.event.workflow_run.repository.full_name }}
        ref: ${{ github.event.workflow_run.head_sha }}
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'

    - name: Setup HTTPS development certificates
      run: |
        dotnet dev-certs https --clean
        dotnet dev-certs https --trust || true

    - name: Restore dependencies
      run: dotnet restore

    - name: Run upgrade
      run: dotnet run --project clypse.portal.setup/clypse.portal.setup.csproj
      env:
        CLYPSE_SETUP__AccessId: ${{ secrets.CLYPSE_SETUP__AccessId }}
        CLYPSE_SETUP__SecretAccessKey: ${{ secrets.CLYPSE_SETUP__SecretAccessKey }}
        CLYPSE_SETUP__Region: ${{ secrets.CLYPSE_SETUP__Region }} # This doesn't need to be a secret
        CLYPSE_SETUP__ResourcePrefix: ${{ secrets.CLYPSE_SETUP__ResourcePrefix }} # This doesn't need to be a secret
        CLYPSE_SETUP__CloudFrontDistributionId: ${{ secrets.CLYPSE_SETUP__CloudFrontDistributionId }}
        CLYPSE_SETUP__UpgradePortalBucketNameOverride: ${{ secrets.CLYPSE_SETUP__UpgradePortalBucketNameOverride }} # This doesn't need to be a secret
        CLYPSE_SETUP__InteractiveMode: false
        CLYPSE_SETUP__EnableUpgradeMode: true
        CLYPSE_SETUP__BuildPortal: true
        CLYPSE_SETUP__ForceUpgrade: true
        CLYPSE_SETUP__DeployedByUser: ${{ github.actor }}
        CLYPSE_SETUP__DeployedAt: ${{ github.event.workflow_run.created_at }}
        CLYPSE_SETUP__DeploymentActionUrl: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: Upgrade summary
      run: |
        echo "Tested commit: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}"
        echo "Branch: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}"
        echo "Run ID: ${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.workflow_run.id }}"
        echo "Upgrade completed successfully."
        echo "Portal upgraded via clypse.portal.setup"
        echo "CloudFront distribution invalidated: ${{ secrets.CLYPSE_PUBLISH_AWS_CLOUDFRONTDISTRIBUTIONID }}"
        echo "Site should be available shortly at your CloudFront domain"
