name: PR Unit Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    if: ${{ github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    container:
      image: squeezybeef/clypse-ci:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'

    - name: Install JavaScript dependencies
      run: |
        cd clypse.portal.ClientScripts
        npm ci

    - name: Lint JavaScript Code
      run: |
        echo "🔍 Running ESLint..."
        cd clypse.portal.ClientScripts
        npm run lint
        echo "✅ ESLint checks passed"

    - name: Run JavaScript Unit Tests
      run: |
        echo "🧪 Running JavaScript Unit Tests..."
        cd clypse.portal.ClientScripts
        npm test
        echo "✅ JavaScript Unit Tests completed"

    - name: Setup HTTPS development certificates
      run: |
        dotnet dev-certs https --clean
        dotnet dev-certs https --trust

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: |
        echo "🧪 Running Unit Tests..."
        dotnet test clypse.core.UnitTests \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --logger trx \
          --results-directory ./TestResults/UnitTests
        echo "✅ Unit Tests completed"

    - name: Upload unit test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: unit-test-results
        path: ./TestResults/UnitTests
